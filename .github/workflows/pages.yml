name: Deploy public shell to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. In-progress runs finish so a half-deployed site is not left
# behind, which is why cancel-in-progress is false rather than true.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Lint, typecheck, test, scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install from the lockfile
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end and security tests
        run: npm run test:e2e
        env:
          VITE_SUPABASE_URL: https://e2etest.supabase.co
          VITE_SUPABASE_ANON_KEY: e2e-anon-key

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Build
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build the shell
        run: npm run build
        env:
          # These are repository VARIABLES, not secrets. Both are public by design: the
          # publishable key identifies the Supabase project and grants nothing on its own,
          # because every table and bucket is behind RLS. See docs/SECURITY_MODEL.md.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_BASE_PATH: /LaTeXRenderer/

      - name: Fail if the build was not configured
        run: |
          if [ -z "${{ vars.VITE_SUPABASE_URL }}" ]; then
            echo "::error::VITE_SUPABASE_URL repository variable is not set."
            echo "Settings -> Secrets and variables -> Actions -> Variables -> New variable."
            exit 1
          fi
          if [ -z "${{ vars.VITE_SUPABASE_ANON_KEY }}" ]; then
            echo "::error::VITE_SUPABASE_ANON_KEY repository variable is not set."
            exit 1
          fi

      - name: Scan the built output for forbidden material
        # SHARED_PASSWORD_CANARY is optional. When it is absent the scanner reports the
        # literal-password check as SKIPPED rather than passing silently, so a missing
        # secret can never be mistaken for a clean scan.
        run: npm run scan:secrets
        env:
          SHARED_PASSWORD_CANARY: ${{ secrets.SHARED_PASSWORD_CANARY }}

      - name: Assert the service-role key is absent from the bundle
        run: |
          if grep -rE 'service_role|sb_secret_|GOCSPX-' dist/ ; then
            echo "::error::Forbidden credential material found in dist/."
            exit 1
          fi
          echo "dist/ is clean."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Post-deployment smoke test
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: The published site must serve HTML and its assets
        run: |
          set -euo pipefail
          BASE="https://julianattemptscoding.github.io/LaTeXRenderer/"

          echo "Waiting for the CDN to pick up the new deploy..."
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE" || true)
            if [ "$code" = "200" ]; then break; fi
            echo "  attempt $attempt: HTTP $code, retrying in 15s"
            sleep 15
          done

          code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE")
          if [ "$code" != "200" ]; then
            echo "::error::$BASE returned HTTP $code"
            exit 1
          fi

          body=$(curl -s "$BASE")
          echo "$body" | grep -q 'id="root"' \
            || { echo "::error::index.html did not contain #root"; exit 1; }

          # Assets are referenced RELATIVELY so the build survives a repository rename.
          # An absolute reference here would mean the base path is baked in again.
          if echo "$body" | grep -qE '(src|href)="/[^"]*assets/'; then
            echo "::error::Absolute asset path found. The build must use a relative base."
            exit 1
          fi

          asset=$(echo "$body" | grep -oE '\./assets/shell-[A-Za-z0-9_-]+\.js' | head -1)
          if [ -z "$asset" ]; then
            echo "::error::No shell bundle referenced in index.html"
            exit 1
          fi
          acode=$(curl -s -o /dev/null -w '%{http_code}' "${BASE}${asset#./}")
          if [ "$acode" != "200" ]; then
            echo "::error::Asset $asset returned HTTP $acode from $BASE"
            exit 1
          fi

          # A self-contained error page, not an app-boot fallback -- booting the app from an
          # unknown path would resolve relative assets from the wrong directory and render blank.
          fcode=$(curl -s -o /dev/null -w '%{http_code}' "${BASE}404.html")
          if [ "$fcode" != "200" ]; then
            echo "::error::404.html is missing"
            exit 1
          fi
          if curl -s "${BASE}404.html" | grep -q 'assets/shell-'; then
            echo "::error::404.html references build assets; it must stand alone."
            exit 1
          fi

          echo "Smoke test passed: $BASE"
