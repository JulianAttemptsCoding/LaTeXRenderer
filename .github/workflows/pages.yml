name: Deploy public shell to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. In-progress runs finish so a half-deployed site is not left
# behind, which is why cancel-in-progress is false rather than true.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Lint, typecheck, test, scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install from the lockfile
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end and security tests (Supabase mode)
        run: npm run test:e2e
        env:
          VITE_SUPABASE_URL: https://e2etest.supabase.co
          VITE_SUPABASE_ANON_KEY: e2e-anon-key

      # Runs against the REAL editor bundle committed in public/app/, which is what a
      # visitor actually receives. Deliberately no VITE_SUPABASE_* -- that absence is
      # what selects direct mode.
      - name: End-to-end tests (direct mode, real editor bundle)
        run: npm run test:direct

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Build
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The editor must be bundled for direct mode. It is committed under public/app/ by
      # `npm run sync:app`, because texCompiler is private and this public workflow has no
      # token to check it out. A missing bundle would deploy a site that signs you in and
      # then cannot open anything, so it fails here instead.
      - name: The editor bundle must be present
        run: |
          if [ ! -f public/app/manifest.json ]; then
            {
              echo "## The editor bundle is missing"
              echo
              echo 'Run this in the LaTeXRenderer checkout, against a built texCompiler:'
              echo
              echo '```'
              echo 'cd ../texCompiler && node scripts/build-protected-app.mjs'
              echo 'cd ../LaTeXRenderer && npm run sync:app && git add public/app && git commit'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Missing editor bundle::public/app/manifest.json not found."
            exit 1
          fi
          node -e "
            const m = require('./public/app/manifest.json');
            const fs = require('fs'), crypto = require('crypto');
            for (const a of m.assets) {
              const b = fs.readFileSync('public/app/' + a.path);
              const d = crypto.createHash('sha256').update(b).digest('hex');
              if (d !== a.sha256) {
                console.error('::error::' + a.path + ' does not match its manifest digest');
                process.exit(1);
              }
            }
            console.log('editor bundle ' + m.buildId + ', ' + m.assets.length + ' assets, digests verified');
          "

      # Supabase is OPTIONAL. Without it the site runs in direct mode: Google sign-in in
      # the browser, editor served from this site. With it, the server-enforced
      # shared-password gate applies. Either is a valid deployment, so a missing variable
      # is reported and the build continues rather than failing.
      - name: Report which mode this deploy will use
        run: |
          if [ -n "${{ vars.VITE_SUPABASE_URL }}" ] && [ -n "${{ vars.VITE_SUPABASE_ANON_KEY }}" ]; then
            echo "MODE=supabase" >> "$GITHUB_ENV"
            echo "### Deploying in **Supabase mode** — server-enforced password gate active." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "MODE=direct" >> "$GITHUB_ENV"
            {
              echo "### Deploying in **direct mode**"
              echo
              echo "Google sign-in runs in the browser and the editor is served from this site."
              echo "Everything works, and nothing further is required."
              echo
              echo "There is **no server-enforced gate** in this mode: the bundle is public and"
              echo "the sign-in cannot be verified server-side. To add one, set the repository"
              echo "variables \`VITE_SUPABASE_URL\` and \`VITE_SUPABASE_ANON_KEY\` (Settings →"
              echo "Secrets and variables → Actions → **Variables**) and re-run. See"
              echo "docs/SECURITY_MODEL.md."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build the shell
        run: npm run build
        env:
          # These are repository VARIABLES, not secrets. Both are public by design: the
          # publishable key identifies the Supabase project and grants nothing on its own,
          # because every table and bucket is behind RLS. See docs/SECURITY_MODEL.md.
          #
          # VITE_BASE_PATH is deliberately NOT set: the build uses a relative base so the
          # same output works at /LaTeXRenderer/, at a bare user-site root, and locally.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Scan the built output for forbidden material
        # SHARED_PASSWORD_CANARY is optional. When it is absent the scanner reports the
        # literal-password check as SKIPPED rather than passing silently, so a missing
        # secret can never be mistaken for a clean scan.
        run: npm run scan:secrets
        env:
          SHARED_PASSWORD_CANARY: ${{ secrets.SHARED_PASSWORD_CANARY }}

      - name: Assert no credential material is in the bundle
        run: |
          set -euo pipefail
          # Match credential SHAPES, not words.
          #
          # The bare strings "service_role" and "GOCSPX-" legitimately appear in the
          # bundle: src/config.ts refuses to start when a service-role key is pasted into
          # the publishable slot, and DriveSetup.tsx refuses a GOCSPX- client secret and
          # explains why. Grepping for the words fails on exactly the code that prevents
          # the leak, which is how the first version of this step broke the build.
          fail=0

          # A JWT whose payload carries role=service_role.
          if grep -rlE 'eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]*service_role' dist/; then
            echo "::error::A service-role JWT is present in dist/."
            fail=1
          fi
          # A Supabase secret key.
          if grep -rlE '\bsb_secret_[A-Za-z0-9_-]{10,}' dist/; then
            echo "::error::A Supabase secret key is present in dist/."
            fail=1
          fi
          # A real Google OAuth client secret, not the bare prefix.
          if grep -rlE '\bGOCSPX-[A-Za-z0-9_-]{10,}' dist/; then
            echo "::error::A Google OAuth client secret is present in dist/."
            fail=1
          fi
          # Private key material.
          if grep -rlE -- '-----BEGIN [A-Z ]*PRIVATE KEY-----' dist/; then
            echo "::error::Private key material is present in dist/."
            fail=1
          fi
          # PBKDF2 material for the shared password.
          if grep -rlE 'SITE_PASSWORD_(HASH|SALT)_B64[[:space:]]*[=:][[:space:]]*["'"'"'`]?[A-Za-z0-9+/]{20,}' dist/; then
            echo "::error::Shared-password PBKDF2 material is present in dist/."
            fail=1
          fi

          [ "$fail" = "0" ] || exit 1
          echo "dist/ carries no credential material."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Post-deployment smoke test
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: The published site must serve HTML and its assets
        run: |
          set -euo pipefail
          BASE="https://julianattemptscoding.github.io/LaTeXRenderer/"

          echo "Waiting for the CDN to pick up the new deploy..."
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE" || true)
            if [ "$code" = "200" ]; then break; fi
            echo "  attempt $attempt: HTTP $code, retrying in 15s"
            sleep 15
          done

          code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE")
          if [ "$code" != "200" ]; then
            echo "::error::$BASE returned HTTP $code"
            exit 1
          fi

          body=$(curl -s "$BASE")
          echo "$body" | grep -q 'id="root"' \
            || { echo "::error::index.html did not contain #root"; exit 1; }

          # Assets are referenced RELATIVELY so the build survives a repository rename.
          # An absolute reference here would mean the base path is baked in again.
          if echo "$body" | grep -qE '(src|href)="/[^"]*assets/'; then
            echo "::error::Absolute asset path found. The build must use a relative base."
            exit 1
          fi

          asset=$(echo "$body" | grep -oE '\./assets/shell-[A-Za-z0-9_-]+\.js' | head -1)
          if [ -z "$asset" ]; then
            echo "::error::No shell bundle referenced in index.html"
            exit 1
          fi
          acode=$(curl -s -o /dev/null -w '%{http_code}' "${BASE}${asset#./}")
          if [ "$acode" != "200" ]; then
            echo "::error::Asset $asset returned HTTP $acode from $BASE"
            exit 1
          fi

          # A self-contained error page, not an app-boot fallback -- booting the app from an
          # unknown path would resolve relative assets from the wrong directory and render blank.
          fcode=$(curl -s -o /dev/null -w '%{http_code}' "${BASE}404.html")
          if [ "$fcode" != "200" ]; then
            echo "::error::404.html is missing"
            exit 1
          fi
          if curl -s "${BASE}404.html" | grep -q 'assets/shell-'; then
            echo "::error::404.html references build assets; it must stand alone."
            exit 1
          fi

          echo "Smoke test passed: $BASE"
